# การตั้งค่า Nginx สำหรับเสิร์ฟหน้าเว็บ Static ที่ Build จาก Next.js บนพอร์ต 80
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # เปิดใช้ Gzip เพื่อบีบอัดไฟล์ JS/CSS/SVG ให้โหลดหน้าเว็บได้เร็วขึ้น
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # แคชไฟล์ Static Assets ที่มี Hash และไฟล์โลโก้
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /Logo/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # รองรับเส้นทางหน้าเว็บและ Fallback กลับไปยัง index.html หรือ 404.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /404.html;
}

